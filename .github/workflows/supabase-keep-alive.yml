name: Supabase keep-alive

on:
  schedule:
    # Lunes y jueves a las 12:00 UTC — mantiene el proyecto activo aunque
    # algún día no se cargue ningún movimiento real.
    - cron: "0 12 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://mgvaguwofeyscbwifyjq.supabase.co/rest/v1/perfiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
